<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#2b3340;-webkit-font-smoothing:antialiased">
    <!-- Hidden inbox-preview line -->
    <span style="display:none!important;visibility:hidden;opacity:0;height:0;width:0;overflow:hidden">{{preheader}}</span>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f9fc;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border:1px solid #dfe4ec;border-radius:16px;overflow:hidden">

            <!-- Brand header — full wordmark logo (name baked in), same as the site navbar -->
            <tr>
              <td style="background:#ffffff;border-bottom:1px solid #dfe4ec;padding:24px 32px" align="center">
                <img src="cid:svastrino-logo" width="200" height="72" alt="Svastrino Consultancy Services" style="display:block;margin:0 auto;width:200px;height:72px;border:0" />
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:34px 32px 32px">
                <h1 style="margin:0 0 14px;font-size:21px;font-weight:700;color:#0f2c5c;line-height:1.3">{{heading}}</h1>
                <p style="margin:0 0 22px;font-size:15px;line-height:1.65;color:#2b3340">{{intro}}</p>

                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 24px">
                  <tr>
                    <td align="center" style="border-radius:10px;background:#2f7ae5">
                      <a href="{{link}}" style="display:inline-block;padding:13px 30px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px">{{cta}}</a>
                    </td>
                  </tr>
                </table>

                <p style="margin:0 0 6px;font-size:12.5px;color:#5b6677">Or paste this link into your browser:</p>
                <p style="margin:0;font-size:12.5px;word-break:break-all"><a href="{{link}}" style="color:#2f7ae5;text-decoration:none">{{link}}</a></p>

                {{note}}
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="background:#f7f9fc;border-top:1px solid #dfe4ec;padding:20px 32px" align="center">
                <p style="margin:0 0 4px;font-size:12px;color:#5b6677">If you didn't request this, you can safely ignore this email.</p>
                <p style="margin:0;font-size:12px;color:#5b6677">&copy; Svastrino Consultancy Services</p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
